name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SILVERFILE_LLM_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact tested dependencies
        run: pip install --no-deps -r requirements.lock
      - name: Unit and integration tests (real MCP server, offline model)
        run: python -m pytest tests/unit tests/integration -q
      - name: Evaluation cases
        run: python run.py eval
